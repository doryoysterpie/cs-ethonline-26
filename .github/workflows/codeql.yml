# First-party static analysis with CodeQL over the TypeScript sources.
# Results go to the repository's code-scanning alerts, which is the one
# write this workflow holds. Pinned to a full commit SHA of the action
# (docs/SECURITY.md section 8). GitHub's "default setup" for code scanning
# must stay unconfigured while this workflow exists, because the two
# conflict; the owner-facing settings are listed in
# docs/SECURITY-FOUNDATION-REPORT.md.
name: CodeQL

on:
  push:
    branches:
      - main
      - 'sprint-*/**'
      - 'parallel/**'
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
