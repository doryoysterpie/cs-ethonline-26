packages:
  - apps/*
  - packages/*

# Single source of truth for every third-party version. Package manifests
# reference these with "catalog:" so the lockfile records one exact version.
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.13.3
  eslint: 10.9.1
  prettier: 3.9.6
  turbo: 2.10.12
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vitest: 4.1.11

# Supply-chain control: refuse to resolve any version published less than
# 24 hours ago (value in minutes). Do not lower this to install a dependency.
# The only permitted exception is the narrow, per-package process in
# docs/DECISIONS.md D13: exact package name, recorded before the dependency
# lands, never a pattern and never pre-approved.
minimumReleaseAge: 1440
